<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>
    <div class="escolha">
        <button class="abacate">Login</button>
        <button class="morango">Cadastro</button>
        <form class="login">
            <input type="text" name="username" placeholder="email de login">
            <input type="password" name="password" placeholder="senha">
            <button>entrar</button>
        </form>

        <form class="cadastrar">
            <input type="text" name="username" placeholder="coloque um novo email">
            <input type="password" name="password" placeholder="senha">
            <button>cadastrar</button>
        </form>
    </div>


    <script>

        // const login = document.querySelector('abacate')
        // const cadastro = document.querySelector('morango')
        // const botao1 = document.querySelector('Login')
        // const botao2 = document.querySelector('cadastrar')


        // login.addEventListener('click', function(event){

        // })

        const frmLogin = document.querySelector('.login')
        frmLogin.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmLogin.username.value,
                    "password": frmLogin.password.value
                })
            })
        })


        const frmCadastro = document.querySelector('.cadastrar')
        frmCadastro.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const response = await fetch("/user", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmCadastro.username.value,
                    "password": frmCadastro.password.value
                })

            })
            return Response.json("deu boa")

            if (response.status == 404)
                return alert("Usuário não encontrado")

            if (response.status == 401)
                return alert("Senha incorreta")

            if (response.ok) {
                window.location.href = "/home"
                return
            }

            alert("Não deveria chegar aqui")
        })

    </script>

</body>

</html
